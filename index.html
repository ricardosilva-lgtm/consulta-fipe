<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta FIPE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Consulta Tabela FIPE</h1>
        <p>Consulte o preço de um carro.</p>

        <form id="formulario">
            <label for="marca">Marca</label>
            <select id="marca" required>
                <option value="">Carregando marcas...</option>
            </select>

            <label for="modelo">Modelo</label>
            <select id="modelo" required disabled>
                <option value="">Selecione a marca primeiro</option>
            </select>

            <label for="ano">Ano e combustível</label>
            <select id="ano" required disabled>
                <option value="">Selecione o modelo primeiro</option>
            </select>

            <button id="consultar" disabled>Consultar preço</button>
        </form>

        <p id="status"></p>
        <p id="resultado"></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
